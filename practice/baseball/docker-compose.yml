services:
  jupyter:
    build: 
      context: .
      dockerfile: env/Dockerfile
    container_name: baseball-jupyter
    image: baseball-jupyter
    ports:
      - "8888:8888"
    volumes:
      - .:/workspace
    environment:
      - PYTHONPATH=/workspace/src
    command: jupyter lab --ip 0.0.0.0 --port 8888 --allow-root --no-browser --NotebookApp.token='baseball'
